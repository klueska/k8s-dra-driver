apiVersion: v1
kind: Pod
metadata:
  name: imex-channel-injection-${INDEX}
spec:
  containers:
  - name: ctr
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["ls -la /dev/nvidia-caps-imex-channels; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: imex-channel
  resourceClaims:
  - name: imex-channel
    resourceClaimTemplateName: imex-channel-injection-${INDEX}
  nodeSelector: { ${NODE_SELECTOR} }
